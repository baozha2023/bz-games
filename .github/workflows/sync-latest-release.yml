name: Sync latest desktop release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Stable release tag, for example v3.2.0
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: Stable release tag, for example v3.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-desktop-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: production-download
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
      SSH_HOST: ${{ vars.RELEASE_SERVER_HOST }}
      SSH_PORT: ${{ vars.RELEASE_SERVER_PORT }}
      SSH_USER: ${{ vars.RELEASE_SERVER_USER }}
      RELEASE_STORAGE_DIR: /var/lib/bz-games-releases
    steps:
      - name: Validate release and Velopack assets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]] || { echo "Tag must be a stable vX.Y.Z version" >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          expected="BZ-Games-Setup-${version}.exe"
          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}")"
          [[ "$(jq -r '.draft' <<<"$release_json")" == "false" ]] || { echo "Draft releases cannot be deployed" >&2; exit 1; }
          [[ "$(jq -r '.prerelease' <<<"$release_json")" == "false" ]] || { echo "Prereleases cannot be deployed" >&2; exit 1; }
          mapfile -t feed_asset_ids < <(jq -r '.assets[] | select(.name == "releases.stable.json") | .id' <<<"$release_json")
          [[ "${#feed_asset_ids[@]}" -eq 1 ]] || { echo "Expected exactly one releases.stable.json asset" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${feed_asset_ids[0]}" -H "Accept: application/octet-stream" > releases.stable.json
          jq -e --arg version "$version" '
            (.Assets | type == "array") and
            (([.Assets[].FileName] | unique | length) == (.Assets | length)) and
            ([.Assets[] | select(.Type == "Full" and .Version == $version)] | length == 1) and
            (all(.Assets[];
              (.Version | type == "string") and
              (.Type == "Full" or .Type == "Delta") and
              (.FileName | type == "string") and
              (.FileName | length > 0) and
              (.FileName | test("[/\\\\]") | not) and
              (.SHA256 | type == "string") and
              (.SHA256 | test("^[A-Fa-f0-9]{64}$")) and
              (.Size | type == "number") and
              (.Size | floor == .) and
              (.Size > 0) and
              (.Size <= 536870912)))
          ' releases.stable.json > /dev/null || { echo "Invalid Velopack stable feed for $version" >&2; exit 1; }
          while IFS=$'\t' read -r filename expected_size expected_sha256; do
            asset="$(jq -c --arg name "$filename" '[.assets[] | select(.name == $name)] | if length == 1 then .[0] else null end' <<<"$release_json")"
            [[ "$asset" != "null" ]] || { echo "Velopack feed asset is missing or duplicated: $filename" >&2; exit 1; }
            actual_size="$(jq -r '.size' <<<"$asset")"
            [[ "$actual_size" == "$expected_size" ]] || { echo "Velopack asset size does not match feed: $filename" >&2; exit 1; }
            digest="$(jq -r '.digest // empty' <<<"$asset")"
            [[ "${digest,,}" == "sha256:${expected_sha256,,}" ]] || { echo "Velopack asset digest does not match feed: $filename" >&2; exit 1; }
          done < <(jq -r '.Assets[] | [.FileName, (.Size | tostring), .SHA256] | @tsv' releases.stable.json)
          mapfile -t asset_ids < <(jq -r --arg name "$expected" '.assets[] | select(.name == $name) | .id' <<<"$release_json")
          [[ "${#asset_ids[@]}" -eq 1 ]] || { echo "Expected exactly one asset named $expected" >&2; exit 1; }
          gh api "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_ids[0]}" -H "Accept: application/octet-stream" > installer.exe
          [[ "$(head -c 2 installer.exe)" == "MZ" ]] || { echo "Release asset is not a Windows executable" >&2; exit 1; }
          size="$(stat -c %s installer.exe)"
          [[ "$size" -gt 0 && "$size" -le 536870912 ]] || { echo "Release asset size is outside the allowed range" >&2; exit 1; }
          sha256="$(sha256sum installer.exe | cut -d' ' -f1)"
          staged="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.exe"
          {
            echo "version=$version"
            echo "size=$size"
            echo "sha256=$sha256"
            echo "staged=$staged"
          } >> "$GITHUB_ENV"

      - name: Configure pinned SSH identity
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' '${{ secrets.RELEASE_SERVER_SSH_PRIVATE_KEY }}' | tr -d '\r' > ~/.ssh/release_deploy
          chmod 0600 ~/.ssh/release_deploy
          printf '%s\n' '${{ secrets.RELEASE_SERVER_KNOWN_HOSTS }}' | tr -d '\r' > ~/.ssh/known_hosts
          chmod 0644 ~/.ssh/known_hosts
          [[ -n "$SSH_HOST" && -n "$SSH_PORT" && -n "$SSH_USER" ]] || { echo "Release server variables are incomplete" >&2; exit 1; }

      - name: Lock, upload and atomically publish
        shell: bash
        run: |
          set -euo pipefail
          ssh_args=(-i ~/.ssh/release_deploy -p "$SSH_PORT" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          staged_path="$RELEASE_STORAGE_DIR/.incoming/$staged"
          remote_command="flock -n -E 75 '$RELEASE_STORAGE_DIR/.publish.lock' /bin/bash -c 'set -euo pipefail; staged_path=\"$staged_path\"; trap \"rm -f -- \\\"\$staged_path\\\"\" EXIT; umask 077; cat > \"\$staged_path\"; /usr/bin/node /opt/bz-games-relay/scripts/publish-desktop-release.js --staged \"\$staged_path\" --version \"$version\" --sha256 \"$sha256\" --size \"$size\" --allow-downgrade false'"
          set +e
          ssh "${ssh_args[@]}" "$SSH_USER@$SSH_HOST" "$remote_command" < installer.exe
          publish_status=$?
          set -e
          if [[ "$publish_status" -eq 75 ]]; then
            echo "Another desktop release upload is already running" >&2
            exit 1
          fi
          [[ "$publish_status" -eq 0 ]] || exit "$publish_status"

      - name: Remove runner credentials
        if: always()
        shell: bash
        run: rm -f ~/.ssh/release_deploy installer.exe releases.stable.json
